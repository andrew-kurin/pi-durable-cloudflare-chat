<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10231f"><title>Pi · Private chat</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><main><header><div class="brand"><span class="orb">π</span><div><h1>Your private Pi</h1><p>Sol thinks. Luna lends a hand.</p></div></div><button id="new" aria-label="New chat">＋ New</button></header><nav><label for="sessions">Conversation</label><select id="sessions"></select><span id="connection">Connecting…</span></nav><section id="setup" hidden><p id="setup-text"></p><button id="connect">Connect subscription</button><a id="verify" target="_blank" rel="noopener noreferrer" hidden>Open secure sign-in</a><strong id="code"></strong></section><section id="search-setup" hidden><p id="search-status" role="status"></p><button id="search-check" type="button">Run approved search check</button></section><section id="messages" aria-live="polite"><div class="welcome"><h2>A little space to think.</h2><p>Ask a question, untangle an idea, or work through something together.</p></div></section><p id="activity" role="status"></p><form id="form"><label class="sr" for="prompt">Message Sol</label><textarea id="prompt" rows="2" maxlength="12000" placeholder="What’s on your mind?" required></textarea><div class="actions"><small>Private · Saved in your Cloudflare account</small><button id="stop" type="button" hidden>Stop</button><button id="send" type="submit">Send ↑</button></div></form><footer><span id="sources"></span><br>Sol orchestrates · Luna handles optional small tasks</footer></main></body></html>
