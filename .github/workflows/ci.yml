name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Offline Pi 1.1 rollback and restore rehearsal
        run: |
          task_pi_legacy=$(mktemp -d)
          trap 'rm -rf "$task_pi_legacy"' EXIT
          npm install --prefix "$task_pi_legacy" --ignore-scripts --no-audit --no-fund --save-exact @earendil-works/pi-durable@1.1.0 @earendil-works/pi-ai@1.1.0 @earendil-works/chord@1.1.0 @earendil-works/pi-telemetry@1.1.0
          node tests/pi-rollback-rehearsal.mjs "$task_pi_legacy"
      - run: node --check public/app.js
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 3
      - name: Hermetic browser module, focus and scroll smoke
        timeout-minutes: 2
        run: |
          task_chrome=$(command -v google-chrome)
          test -x "$task_chrome"
          CHROME_EXECUTABLE="$task_chrome" node --import tsx tests/ui.mjs
          CHROME_EXECUTABLE="$task_chrome" node tests/mobile-reading.mjs
          CHROME_EXECUTABLE="$task_chrome" node tests/compact-identifiers.mjs
          CHROME_EXECUTABLE="$task_chrome" node tests/workspace-resume.mjs
          CHROME_EXECUTABLE="$task_chrome" node tests/copy-controls.mjs
          CHROME_EXECUTABLE="$task_chrome" node tests/maintenance-controls.mjs
