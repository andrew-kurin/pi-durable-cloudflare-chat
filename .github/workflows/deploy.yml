name: Deploy production manually

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Reviewed deployment target (staging requires its own protected environment)'
        type: choice
        default: production
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: deployment-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require main branch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node --check public/app.js
      - run: npm run build

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.target || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Prepare private deployment configuration
        run: node scripts/prepare-deploy.mjs
        env:
          DEPLOY_TARGET: ${{ inputs.target || 'production' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          WORKERS_DEV: ${{ vars.WORKERS_DEV }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
          ENABLE_MODEL: ${{ vars.ENABLE_MODEL }}
          ENABLE_SUBSCRIPTION_LOGIN: ${{ vars.ENABLE_SUBSCRIPTION_LOGIN }}
          ENABLE_WEB_SEARCH: ${{ vars.ENABLE_WEB_SEARCH }}
          ENABLE_WEB_SEARCH_TEST: ${{ vars.ENABLE_WEB_SEARCH_TEST }}
          PROVISION_WORKSPACE: ${{ vars.PROVISION_WORKSPACE }}
          ENABLE_WORKSPACE: ${{ vars.ENABLE_WORKSPACE }}
          WORKSPACE_REPOSITORY: ${{ vars.WORKSPACE_REPOSITORY }}
          WORKSPACE_IMAGE_REFERENCE: ${{ vars.WORKSPACE_IMAGE_REFERENCE }}
      - name: Require staging encryption secret (names only)
        if: inputs.target == 'staging'
        run: |
          npx --no-install wrangler secret list --format json --config .deploy.wrangler.json > "$RUNNER_TEMP/pi-staging-secret-names.json"
          node -e "const fs=require('node:fs'); const names=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pi-staging-secret-names.json','utf8')); if(!names.some(entry=>entry.name==='CREDENTIAL_ENCRYPTION_KEY')) throw Error('Missing staging-only encryption secret; owner must provision it directly without copying production');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy validated commit
        run: npx --no-install wrangler deploy --config .deploy.wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove private deployment configuration
        if: always()
        run: rm -f .deploy.wrangler.json "$RUNNER_TEMP/pi-staging-secret-names.json"
