name: Deploy production manually

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Reviewed deployment target (staging requires its own protected environment)'
        type: choice
        default: production
        options:
          - production
          - staging
      build_workspace_image:
        description: 'Approved one-image build/upload; pin its registry manifest digest'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deployment-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require main branch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: test "$DISPATCH_REF" = refs/heads/main
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: node --check public/app.js
      - run: npm run build

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.target || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Build and upload approved workspace image
        if: inputs.build_workspace_image
        run: |
          task_image_tag="pi-workspace:${GITHUB_SHA}"
          docker build --platform linux/amd64 --tag "$task_image_tag" --file workspace/Dockerfile workspace
          npx --no-install wrangler containers push "$task_image_tag"
          task_registry_tag="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${task_image_tag}"
          docker pull "$task_registry_tag"
          task_registry_ref=$(docker image inspect "$task_registry_tag" --format '{{join .RepoDigests "\n"}}' | sed -n '\|^registry.cloudflare.com/|p' | head -1)
          printf '%s' "$task_registry_ref" | grep -Eq '^registry\.cloudflare\.com/[a-f0-9]{32}/pi-workspace@sha256:[a-f0-9]{64}$'
          printf 'WORKSPACE_IMAGE_REFERENCE=%s\n' "$task_registry_ref" >> "$GITHUB_ENV"
          printf 'Pinned workspace image: %s\n' "$task_registry_ref" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Prepare private deployment configuration
        run: node scripts/prepare-deploy.mjs
        env:
          DEPLOY_TARGET: ${{ inputs.target || 'production' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          WORKERS_DEV: ${{ vars.WORKERS_DEV }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
          ENABLE_MODEL: ${{ vars.ENABLE_MODEL }}
          ENABLE_MODEL_RUNNER: ${{ vars.ENABLE_MODEL_RUNNER }}
          MODEL_RUNNER_ENDPOINT: ${{ vars.MODEL_RUNNER_ENDPOINT }}
          ENABLE_SUBSCRIPTION_LOGIN: ${{ vars.ENABLE_SUBSCRIPTION_LOGIN }}
          ENABLE_GROK_SUBSCRIPTION: ${{ vars.ENABLE_GROK_SUBSCRIPTION }}
          ENABLE_WEB_SEARCH: ${{ vars.ENABLE_WEB_SEARCH }}
          ENABLE_WEB_SEARCH_TEST: ${{ vars.ENABLE_WEB_SEARCH_TEST }}
          PROVISION_WORKSPACE: ${{ vars.PROVISION_WORKSPACE }}
          ENABLE_WORKSPACE: ${{ vars.ENABLE_WORKSPACE }}
          ENABLE_WORKSPACE_SMOKE: ${{ vars.ENABLE_WORKSPACE_SMOKE }}
          WORKSPACE_REPOSITORY: ${{ vars.WORKSPACE_REPOSITORY }}
          WORKSPACE_IMAGE_REFERENCE: ${{ env.WORKSPACE_IMAGE_REFERENCE || vars.WORKSPACE_IMAGE_REFERENCE }}
      - name: Deploy validated commit
        run: npx --no-install wrangler deploy --config .deploy.wrangler.json --durable-objects-code-update-mode immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove private deployment configuration
        if: always()
        run: rm -f .deploy.wrangler.json
